<title>Foxy Fight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;600&family=Limelight&display=swap">
<style>
/* Foxy Fight — cabaret and speakeasy.
   Layout: a single app column (max ~1180px) with a marquee top bar; the battle screen is a
   three-band stage (opponent / chain lane / you) above a hand tray.
   One deliberate look: lamplit gold and cream on oxblood black, art deco frames. */
:root {
  --bg: #140d0e;
  --bg-2: #1f1416;
  --surface: #24181a;
  --surface-2: #2e1f21;
  --ink: #f2e4c9;
  --ink-2: #d6c3a3;
  --muted: #a08a72;
  --line: #3f2c29;
  --gold: #d6aa55;
  --gold-2: #f0d28c;
  --wine: #8e2437;
  --lav: var(--gold);          /* UI accent */
  --lav-ink: var(--gold-2);    /* accent text */
  --tag-opener: #e3c47e;
  --tag-light: #d98fa0;
  --tag-heavy: #d58a5c;
  --tag-finisher: #dd5a72;
  --tag-guard: #63b1a2;
  --tag-wild: #b596d3;
  --tag-ink: #1b1011;
  --hp: #d6aa55;
  --hp-low: #dd5a72;
  --block: #6fa6b6;
  --energy: #f0c45a;
  --danger: #ec6f86;
  --good: #86d1a6;
  --frame: color-mix(in srgb, var(--gold) 28%, transparent);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .35);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 34px rgba(0, 0, 0, .55);
  --radius: 14px;
  --radius-sm: 9px;
  --font-display: "Limelight", "Didot", Georgia, serif;
  --font-body: "Josefin Sans", "Futura", "Century Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--ink);
  background: radial-gradient(1100px 520px at 50% -12%, rgba(214, 170, 85, .14), transparent 62%), var(--bg);
  background-attachment: fixed;
  font: 16px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { font-weight: 700; text-wrap: balance; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; letter-spacing: .02em; color: var(--gold-2); }
h2 { font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; }
h3 { font-size: .95rem; letter-spacing: .04em; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: .74rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--lav); outline-offset: 2px; border-radius: 8px; }

.app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 12px; margin-bottom: 18px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 3px double var(--frame);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 1.35rem; color: var(--gold-2); letter-spacing: .04em; }
.brand-mark { width: 34px; height: 34px; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
.nav button {
  border: 0; background: transparent; padding: 8px 13px 6px; border-radius: 999px; cursor: pointer;
  color: var(--ink-2); font-weight: 600; font-size: .86rem; letter-spacing: .12em; text-transform: uppercase;
}
.nav button:hover { background: var(--bg-2); }
.nav button[aria-current="page"] { background: var(--surface); color: var(--gold-2); box-shadow: inset 0 0 0 1px var(--frame); }
.who { display: flex; align-items: center; gap: 10px; }
.xp-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
  background: var(--gold); color: #1b1011; font-weight: 700; font-size: .85rem;
}
.style-chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--frame); font-weight: 600; font-size: .85rem; border: 0; cursor: pointer; color: var(--ink);
}
.style-chip .emblem { width: 26px; height: 26px; }

/* ---------- generic ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 11px 22px 9px; cursor: pointer; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem;
  background: var(--gold); color: #1b1011; transition: transform .12s ease, box-shadow .12s ease, opacity .12s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(0); }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.soft { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--frame); }
.btn.lav { background: var(--gold-2); color: #1b1011; }
.btn.small { padding: 7px 14px 5px; font-size: .76rem; }
.btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow), inset 0 0 0 1px var(--frame); padding: 20px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px;
  font-size: .72rem; font-weight: 700; letter-spacing: .02em; background: var(--bg-2); color: var(--ink-2);
}
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--gold-2); color: #1b1011; padding: 10px 18px; border-radius: 999px; font-weight: 600;
  box-shadow: var(--shadow-lift); z-index: 60; animation: toast-in .25s ease;
  max-width: calc(100vw - 32px);
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } }

/* tag colors */
.tag-opener { --tag: var(--tag-opener); }
.tag-light { --tag: var(--tag-light); }
.tag-heavy { --tag: var(--tag-heavy); }
.tag-finisher { --tag: var(--tag-finisher); }
.tag-guard { --tag: var(--tag-guard); }
.tag-wild { --tag: var(--tag-wild); }
.tag-chip { background: var(--tag, var(--bg-2)); color: var(--tag-ink); }

/* ---------- card ---------- */
.card {
  --w: 168px;
  position: relative; width: var(--w); flex: 0 0 auto;
  background: var(--surface); border-radius: 12px; box-shadow: var(--shadow), inset 0 0 0 1px var(--frame);
  display: flex; flex-direction: column; overflow: hidden; text-align: left;
  border: 0; padding: 0; cursor: default; color: var(--ink);
  transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
}
button.card { cursor: pointer; }
.card .art { position: relative; aspect-ratio: 16 / 10; background: var(--bg-2); overflow: hidden; }
.card .art svg, .card .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.card .cost {
  position: absolute; top: 8px; left: 8px; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: .9rem; padding-top: 2px;
  background: var(--gold); color: #1b1011; box-shadow: 0 0 0 2px #1b1011, 0 0 0 3px var(--gold);
}
.card .tier { position: absolute; top: 9px; right: 9px; }
.card .body { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.card .name { font-weight: 700; font-size: .8rem; line-height: 1.25; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-2); }
.card .text { font-size: .78rem; line-height: 1.35; color: var(--ink-2); }
.card .link {
  font-size: .76rem; line-height: 1.3; padding: 5px 7px; border-radius: 8px;
  background: color-mix(in srgb, var(--tag, var(--lav)) 18%, transparent); color: var(--ink); box-shadow: inset 2px 0 0 var(--tag, var(--lav));
}
.card .link b { font-weight: 800; letter-spacing: .04em; font-size: .66rem; text-transform: uppercase; margin-right: 4px; }
.card .flavor { font-size: .72rem; line-height: 1.35; font-style: italic; color: var(--muted); }
.style-tag { gap: 6px; background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--frame); }
.style-tag i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px var(--gold); }
.card .follows { margin-top: auto; font-size: .7rem; color: var(--muted); padding-top: 5px; border-top: 1px solid var(--line); }
.card .follows strong { color: var(--ink-2); font-weight: 700; }
.card.compact { --w: 150px; }
.card.compact .text { font-size: .74rem; }

.hand .card.linkable { box-shadow: 0 0 0 3px var(--tag, var(--lav)), var(--shadow-lift); transform: translateY(-6px); }
.hand .card.linkable::after {
  content: "LINK"; position: absolute; top: 42px; right: 8px; background: var(--gold); color: #1b1011;
  font: 700 .66rem/1 var(--font-body); letter-spacing: .14em; padding: 5px 8px 3px; border-radius: 999px;
}
.hand .card:hover:not(.unaffordable) { transform: translateY(-10px); box-shadow: var(--shadow-lift); }
.hand .card.linkable:hover { box-shadow: 0 0 0 3px var(--tag, var(--lav)), var(--shadow-lift); }
.hand .card.unaffordable { opacity: .45; cursor: not-allowed; }
.hand .card .key {
  position: absolute; bottom: 7px; right: 9px; font: 600 .65rem var(--font-mono); color: var(--muted);
}

/* ---------- emblem ---------- */
.emblem { display: block; border-radius: 50%; overflow: hidden; flex: 0 0 auto; }

/* ---------- character select ---------- */
.hero-select { display: grid; gap: 22px; padding-block: 24px 8px; }
.hero-select h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); }
.hero-select .lede { max-width: 60ch; color: var(--ink-2); font-size: 1.02rem; }
.fighters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 18px; }
.fighter-card { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: start; }
.fighter-card .emblem { width: 96px; height: 96px; }
.fighter-card .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-2); }
.fighter-card .meta b { color: var(--ink); }
.how {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; margin-top: 8px;
}
.how .step { background: var(--surface-2); border-radius: var(--radius-sm); padding: 14px; font-size: .88rem; color: var(--ink-2); }
.how .step h3 { margin-bottom: 4px; color: var(--ink); }
.chain-demo { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.chain-demo .arrow { color: var(--muted); }

/* ---------- ladder ---------- */
.ladder { display: grid; gap: 12px; }
.rung {
  display: grid; grid-template-columns: auto 64px 1fr auto; gap: 16px; align-items: center;
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow), inset 0 0 0 1px var(--frame); padding: 14px 18px;
}
.rung .order { font-family: var(--font-display); color: var(--gold); font-size: 1.4rem; width: 2ch; text-align: center; }
.rung .emblem { width: 64px; height: 64px; }
.rung .info { min-width: 0; }
.rung .quote { font-style: italic; color: var(--ink-2); font-size: .88rem; margin-top: 2px; }
.rung .side { display: flex; flex-direction: column; align-items: end; gap: 6px; }
.rung.locked { opacity: .55; }
.rung.next { box-shadow: 0 0 0 2px var(--lav), var(--shadow); }
.state-chip.beaten { background: var(--tag-guard); color: #10231f; }
.state-chip.next { background: var(--gold); color: #1b1011; }
.state-chip.locked { background: var(--bg-2); color: var(--muted); }
@media (max-width: 640px) {
  .rung { grid-template-columns: 48px 1fr; }
  .rung .order { display: none; }
  .rung .emblem { width: 48px; height: 48px; }
  .rung .side { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
}

/* ---------- battle ---------- */
.battle { display: grid; gap: 14px; }
.fighter-band {
  display: grid; grid-template-columns: 72px 1fr auto; gap: 16px; align-items: center;
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow), inset 0 0 0 1px var(--frame); padding: 14px 18px; position: relative;
}
.fighter-band.active { box-shadow: 0 0 0 2px var(--lav), var(--shadow); }
.fighter-band .portrait { position: relative; width: 72px; height: 72px; }
.fighter-band .portrait .emblem { width: 72px; height: 72px; }
.fighter-band .portrait.hit { animation: shake .35s ease; }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.fighter-band .name-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fighter-band .name-row h2 { font-size: .98rem; color: var(--gold-2); }
.bars { display: grid; gap: 6px; margin-top: 6px; }
.hpbar { position: relative; height: 16px; border-radius: 999px; background: var(--bg-2); overflow: hidden; }
.hpbar .fill { position: absolute; inset: 0 auto 0 0; background: var(--hp); border-radius: 999px; transition: width .45s cubic-bezier(.3, .8, .3, 1), background .3s; }
.hpbar .ghost { position: absolute; inset: 0 auto 0 0; background: var(--hp-low); opacity: .55; border-radius: 999px; transition: width .9s ease .25s; }
.hpbar.low .fill { background: var(--hp-low); }
.hpbar .label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 .74rem var(--font-body); color: #fff6e3; letter-spacing: .08em; padding-top: 2px; text-shadow: 0 1px 2px rgba(0, 0, 0, .75); }
.status-row { display: flex; gap: 6px; flex-wrap: wrap; min-height: 22px; align-items: center; }
.status {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; border-radius: 999px;
  font-size: .72rem; font-weight: 700; background: color-mix(in srgb, var(--sc) 45%, var(--surface)); color: var(--ink); cursor: help;
}
.status i { width: 14px; height: 14px; border-radius: 50%; background: var(--sc); display: inline-block; }
.shield {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--block) 40%, var(--surface)); font-weight: 800; font-size: .75rem;
}
.band-side { display: flex; flex-direction: column; align-items: end; gap: 6px; font-size: .78rem; color: var(--muted); }
.energy { display: flex; gap: 5px; }
.energy .pip { width: 16px; height: 16px; border-radius: 50%; background: var(--bg-2); box-shadow: inset 0 0 0 1.5px var(--line); }
.energy .pip.on { background: var(--energy); box-shadow: none; }
.energy .pip.extra { background: var(--tag-heavy); box-shadow: none; }
.pile-counts { display: flex; gap: 10px; }
.floater {
  position: absolute; left: 50%; top: 34%; transform: translateX(-50%); pointer-events: none; z-index: 5;
  font: 400 1.35rem var(--font-display); color: var(--danger); text-shadow: 0 2px 0 #000;
  animation: float-up 1.1s ease forwards; white-space: nowrap;
}
.floater.block { color: var(--block); }
.floater.heal { color: var(--good); }
.floater.small { font-size: .85rem; }
@keyframes float-up { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -38px) scale(1); } }

.lane {
  display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center;
  padding: 14px 18px; border-radius: var(--radius); min-height: 112px;
  background: repeating-linear-gradient(90deg, transparent 0 22px, rgba(214, 170, 85, .045) 22px 23px), var(--bg-2);
  box-shadow: inset 0 0 0 1px var(--frame);
}
.combo { text-align: center; min-width: 120px; }
.combo .count { font: 400 2.6rem/1 var(--font-display); color: var(--gold-2); transition: transform .2s; display: block; }
.combo .count.pop { animation: pop .35s ease; }
@keyframes pop { 40% { transform: scale(1.3); } }
.combo .lbl { font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.combo .bonus { font-size: .75rem; color: var(--lav-ink); font-weight: 700; min-height: 1.2em; }
.played { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding-block: 4px; min-width: 0; scrollbar-width: thin; }
.played .mini {
  flex: 0 0 auto; display: flex; flex-direction: column; gap: 2px; padding: 8px 11px; border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--frame); min-width: 104px; font-size: .74rem; animation: slide-in .25s ease;
  border-top: 4px solid var(--tag, var(--line));
}
.played .mini b { font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.played .mini.linked .lk { color: var(--lav-ink); font-weight: 800; font-size: .64rem; letter-spacing: .08em; }
.played .mini .lk { color: var(--muted); font-size: .64rem; font-weight: 700; letter-spacing: .08em; }
.played .joiner { color: var(--muted); font-weight: 800; }
.played .joiner.broken { color: var(--line); }
.played .empty { color: var(--muted); font-size: .88rem; }
.recap { font-size: .8rem; color: var(--muted); min-height: 1.2em; }
@keyframes slide-in { from { opacity: 0; transform: translateY(8px); } }

.hand-tray { display: grid; gap: 10px; }
.hand-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hint { font-size: .85rem; color: var(--ink-2); }
.hand { display: flex; gap: 12px; padding: 14px 4px 10px; overflow-x: auto; min-height: 290px; align-items: flex-start; scrollbar-width: thin; }
.log { font-size: .8rem; color: var(--muted); max-height: 110px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 2px; }
.log div:first-child { color: var(--ink-2); }
details.log-wrap summary { cursor: pointer; font-size: .82rem; color: var(--muted); }

@media (max-width: 640px) {
  .fighter-band { grid-template-columns: 52px 1fr; padding: 12px 14px; gap: 12px; }
  .fighter-band .portrait, .fighter-band .portrait .emblem { width: 52px; height: 52px; }
  .band-side { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
  .lane { grid-template-columns: 1fr; }
  .combo { display: flex; gap: 10px; align-items: baseline; justify-content: center; }
  .combo .count { font-size: 1.8rem; }
  .card { --w: 148px; }
  .hand { min-height: 260px; }
}

/* ---------- rounds ---------- */
.round-strip {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 16px 6px; border-radius: 999px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--frame); font-size: .82rem;
}
.round-strip .rnum { font-family: var(--font-display); font-size: 1.15rem; color: var(--gold-2); }
.round-strip .rnum small { font-family: var(--font-body); font-size: .75rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.round-strip .pips { display: inline-flex; gap: 5px; }
.round-strip .pips i { width: 22px; height: 6px; border-radius: 3px; background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--frame); }
.round-strip .pips i.done { background: var(--gold); box-shadow: none; }
.round-strip .pips i.now { background: var(--gold-2); box-shadow: 0 0 8px var(--gold); }
.round-strip .cards-so-far { display: inline-flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.chip.rd { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--frame); }
.chip.rd.you { background: var(--gold); color: #1b1011; box-shadow: none; }
.chip.rd.them { background: var(--wine); color: var(--ink); box-shadow: none; }
.kd { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; }
.kd i { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--frame); }
.kd i.on { background: var(--danger); box-shadow: none; }
.lane { position: relative; }
.flash {
  position: absolute; inset: 0; z-index: 4; display: grid; place-content: center; text-align: center; gap: 4px;
  background: rgba(14, 9, 10, .82); border-radius: var(--radius); pointer-events: none;
}
.flash b { font: 400 2.2rem/1 var(--font-display); color: var(--gold-2); text-shadow: 0 0 18px rgba(214, 170, 85, .5); }
.flash span { font-size: .9rem; color: var(--ink-2); letter-spacing: .06em; }
.flash.go { animation: flash-in 1.9s ease forwards; }
@keyframes flash-in { 0% { opacity: 0; transform: scale(.96); } 10% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.scorecard { width: 100%; border-collapse: collapse; font-size: .9rem; }
.scorecard th, .scorecard td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; }

<script>/* src/data.js */
/* Foxy Fight — sheet data loading, parsing and validation.
 * Works in the browser (attaches to window.CB) and in Node (module.exports).
 * Every tab of the Google Sheet arrives as CSV text; compileData() turns the
 * tabs into one validated game-data object the engine reads. */
(function (root, factory) {
  const mod = factory();
  if (typeof module === 'object' && module.exports) module.exports = mod;
  else root.CB = Object.assign(root.CB || {}, mod);
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* REQUIRED_TABS must exist. OPTIONAL_TABS may be missing (older sheets keep
   * working); TABS lists them all, so CSV loading and baking pick them up. */
  const REQUIRED_TABS = ['Config', 'Styles', 'Cards', 'Statuses', 'Opponents'];
  const OPTIONAL_TABS = ['CutIns', 'Fighters'];
  const TABS = REQUIRED_TABS.concat(OPTIONAL_TABS);
  /* A tab only counts as present when its header has these columns. Google's
   * export can hand back a different tab when the asked-for one doesn't exist. */
  const TAB_SIGNATURE = { CutIns: ['fighter', 'move'], Fighters: ['id', 'style', 'outfit_of'] };
  /* Cut-in art: each CutIns row has profile_0..2 and pov_0..2. */
  const CUTIN_SLOTS = 3;
  const CUTIN_VIEWS = ['profile', 'pov'];
  const CUTIN_EVENTS = ['knockdown', 'victory'];
  const STATUS_BEHAVIORS = ['dot', 'damage_taken_up', 'damage_dealt_up', 'energy_down', 'draw_down', 'block_gain_up', 'thorns'];
  const STATUS_DECAYS = ['turn', 'clear', 'consume', 'none'];
  const BENEFICIAL = ['damage_dealt_up', 'block_gain_up', 'thorns'];
  const EFFECT_OPS = {
    dmg: 'Deal damage. dmg:5 or dmg:2x3 (3 hits of 2)',
    pierce: 'Deal damage that ignores block. pierce:4',
    dmgchain: 'Deal N damage per card in the current chain, as one hit. dmgchain:2',
    block: 'Gain block. block:5',
    heal: 'Restore HP (up to max). heal:4',
    draw: 'Draw cards. draw:1',
    energy: 'Gain energy this turn. energy:1',
    apply: 'Give the opponent a status. apply:bleed:2',
    gain: 'Give yourself a status. gain:focus:2',
  };

  /* ---------- CSV ---------- */
  function parseCSV(text) {
    if (text == null) return [];
    text = String(text).replace(/^﻿/, '');
    const rows = [];
    let row = [], field = '', i = 0, inQuotes = false;
    while (i < text.length) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function rowsToObjects(rows) {
    if (!rows.length) return [];
    const header = rows[0].map(h => String(h).trim().toLowerCase().replace(/\s+/g, '_'));
    const out = [];
    for (let r = 1; r < rows.length; r++) {
      const cells = rows[r];
      if (!cells.some(c => String(c).trim() !== '')) continue;          // blank row
      if (String(cells[0] || '').trim().startsWith('#')) continue;      // comment row
      const obj = { _row: r + 1 };
      if (cells.slice(header.length).some(c => String(c).trim() !== '')) obj._extra = true;
      header.forEach((h, idx) => { if (h) obj[h] = String(cells[idx] == null ? '' : cells[idx]).trim(); });
      out.push(obj);
    }
    return out;
  }

  /* ---------- small value parsers ---------- */
  const num = (v, d) => { if (v === '' || v == null) return d; const n = Number(v); return Number.isFinite(n) ? n : d; };
  const bool = (v, d) => { if (v === '' || v == null) return d; return /^(true|yes|y|1)$/i.test(String(v).trim()); };
  const list = v => String(v || '').split(/[,|]/).map(s => s.trim()).filter(Boolean);
  const key = s => String(s).trim().toLowerCase();

  function parseDeckList(str) {
    const ids = [], errors = [];
    list(str).forEach(part => {
      const m = part.match(/^([\w-]+)(?:\s*[x×*]\s*(\d+))?$/i);
      if (!m) { errors.push(`can't read "${part}" (use card_id x2)`); return; }
      const n = m[2] ? parseInt(m[2], 10) : 1;
      for (let k = 0; k < n; k++) ids.push(m[1]);
    });
    return { ids, errors };
  }

  function parseEffects(str, statuses) {
    const effects = [], errors = [];
    String(str || '').split(/[;\n]/).map(s => s.trim()).filter(Boolean).forEach(part => {
      const bits = part.split(':').map(s => s.trim());
      const op = key(bits[0]);
      if (!EFFECT_OPS[op]) { errors.push(`unknown effect "${bits[0]}"`); return; }
      if (op === 'apply' || op === 'gain') {
        const status = key(bits[1] || '');
        const n = num(bits[2], 1);
        if (statuses && !statuses[status]) errors.push(`unknown status "${bits[1]}" in "${part}"`);
        effects.push({ op, status, n });
        return;
      }
      if (op === 'dmg') {
        const m = String(bits[1] || '').match(/^(\d+)\s*(?:[x×*]\s*(\d+))?$/i);
        if (!m) { errors.push(`can't read "${part}" (use dmg:5 or dmg:2x3)`); return; }
        effects.push({ op, n: +m[1], hits: m[2] ? +m[2] : 1 });
        return;
      }
      const n = Number(bits[1]);
      if (!Number.isFinite(n)) { errors.push(`"${part}" needs a number`); return; }
      effects.push({ op, n });
    });
    return { effects, errors };
  }

  function describeEffects(effects, data) {
    return effects.map(e => {
      const sName = e.status && data && data.statuses[e.status] ? data.statuses[e.status].name : e.status;
      switch (e.op) {
        case 'dmg': return e.hits > 1 ? `Deal ${e.n} damage ${e.hits} times.` : `Deal ${e.n} damage.`;
        case 'pierce': return `Deal ${e.n} piercing damage.`;
        case 'dmgchain': return `Deal ${e.n} damage per card in the chain.`;
        case 'block': return `Gain ${e.n} block.`;
        case 'heal': return `Heal ${e.n}.`;
        case 'draw': return `Draw ${e.n}.`;
        case 'energy': return `Gain ${e.n} energy.`;
        case 'apply': return `Apply ${e.n} ${sName}.`;
        case 'gain': return `Gain ${e.n} ${sName}.`;
      }
      return '';
    }).join(' ');
  }

  function headerKeys(rows) {
    return rows.length ? rows[0].map(h => String(h).trim().toLowerCase().replace(/\s+/g, '_')) : [];
  }
  function hasSignature(tab, rows) {
    const need = TAB_SIGNATURE[tab];
    if (!need) return true;
    const head = headerKeys(rows);
    return need.every(c => head.includes(c));
  }

  /* ---------- cut-in art (CutIns + Fighters tabs) ----------
   * Art problems are warnings, never errors: a typo in an image row must not
   * stop the sheet loading. The fight runs and that image falls back. */
  function compileArt(T, data, warnings) {
    const { styles, cards, opponents } = data;
    const oppIds = new Set(opponents.map(o => o.id));

    // Fighters: custom looks that dress a style.
    const fighters = {}, fighterList = [];
    T.Fighters.forEach(r => {
      const id = (r.id || '').trim();
      if (!id) return;
      const where = `Fighters row ${r._row} (${id})`;
      if (fighters[id]) { warnings.push(`${where}: duplicate id, row ignored.`); return; }
      if (styles[id] || oppIds.has(id)) { warnings.push(`${where}: id is already used by a style or opponent, row ignored.`); return; }
      const style = (r.style || '').trim();
      if (!styles[style]) { warnings.push(`${where}: style "${style}" is not in the Styles tab, row ignored.`); return; }
      const f = { id, name: r.name || id, style, outfitOf: (r.outfit_of || '').trim(), art: r.art || '', row: r._row };
      fighters[id] = f; fighterList.push(f);
    });
    fighterList.forEach(f => {
      if (!f.outfitOf) return;
      const where = `Fighters row ${f.row} (${f.id})`;
      if (!fighters[f.outfitOf]) { warnings.push(`${where}: outfit_of "${f.outfitOf}" is not a Fighters id, so it was ignored.`); f.outfitOf = ''; return; }
      const seen = new Set([f.id]);
      for (let g = fighters[f.outfitOf]; g; g = fighters[g.outfitOf]) {
        if (seen.has(g.id)) { warnings.push(`${where}: outfit_of loops back on itself, so it was ignored.`); f.outfitOf = ''; return; }
        seen.add(g.id);
      }
      const rootOf = sid => styles[sid].root;
      if (rootOf(fighters[f.outfitOf].style) !== rootOf(f.style)) warnings.push(`${where}: its style and the style of "${f.outfitOf}" are in different style lines.`);
    });
    fighterList.forEach(f => {
      let g = f;
      while (g.outfitOf) g = fighters[g.outfitOf];
      f.family = g.id;
    });

    // CutIns: one row per fighter + move.
    const tagNames = {};
    data.cardList.forEach(c => c.tags.forEach(t => { tagNames[key(t)] = t; }));
    const cutins = {};
    T.CutIns.forEach(r => {
      const fighter = (r.fighter || '').trim();
      const moveRaw = (r.move || '').trim();
      const where = `CutIns row ${r._row}`;
      if (!fighter) { warnings.push(`${where}: no fighter, row ignored.`); return; }
      const kind = styles[fighter] ? 'style' : (oppIds.has(fighter) ? 'opponent' : (fighters[fighter] ? 'custom' : ''));
      if (!kind) warnings.push(`${where}: fighter "${fighter}" is not a style, opponent or Fighters id.`);
      let move;
      if (!moveRaw) move = 'any';
      else if (cards[moveRaw]) move = 'card:' + moveRaw;
      else if (tagNames[key(moveRaw)]) move = 'tag:' + key(moveRaw);
      else if (CUTIN_EVENTS.includes(key(moveRaw))) move = key(moveRaw);
      else { warnings.push(`${where} (${fighter}): move "${moveRaw}" is not a card id, a tag, Knockdown, Victory or blank. Row ignored.`); return; }
      const slots = view => Array.from({ length: CUTIN_SLOTS }, (_, i) => String(r[`${view}_${i}`] || '').trim());
      const entry = { profile: slots('profile'), pov: slots('pov'), row: r._row };
      const byFighter = cutins[fighter] || (cutins[fighter] = {});
      if (byFighter[move]) { warnings.push(`${where} (${fighter} ${moveRaw || 'any move'}): repeats row ${byFighter[move].row}, so it was ignored.`); return; }
      if (kind === 'opponent' && entry.profile.some(Boolean)) warnings.push(`${where} (${fighter}): ladder opponents are only ever seen in POV, so the profile art here is never shown.`);
      byFighter[move] = entry;
    });
    data.fighters = fighters;
    data.fighterList = fighterList;
    data.cutins = cutins;
  }

  /* ---------- compile ---------- */
  function compileData(tables, meta) {
    const errors = [], warnings = [];
    const T = {};
    TABS.forEach(t => {
      const raw = tables[t];
      const optional = OPTIONAL_TABS.includes(t);
      if (raw == null || (optional && String(raw).trim() === '')) {
        if (!optional) errors.push(`Missing tab "${t}".`);
        T[t] = []; return;
      }
      if (Array.isArray(raw)) { T[t] = raw; return; }
      const rows = parseCSV(raw);
      if (optional && !hasSignature(t, rows)) {
        warnings.push(`The ${t} tab is missing its ${TAB_SIGNATURE[t].join(', ')} column${TAB_SIGNATURE[t].length > 1 ? 's' : ''}, so it was ignored.`);
        T[t] = []; return;
      }
      T[t] = rowsToObjects(rows);
    });

    TABS.forEach(t => T[t].forEach(r => {
      if (r._extra) warnings.push(`${t} row ${r._row} has more cells than column headers. A value containing a comma probably needs quotes.`);
    }));

    // Config
    const config = {};
    T.Config.forEach(r => {
      if (!r.key) return;
      const v = r.value;
      config[key(r.key)] = /^(true|false)$/i.test(v) ? bool(v) : (Number.isFinite(Number(v)) && v !== '' ? Number(v) : v);
    });
    const defaults = {
      hand_size: 5, energy_per_turn: 3, first_turn_energy_penalty: 1, first_turn_draw_penalty: 0, discard_hand_end_of_turn: true,
      block_resets_each_turn: true, combo_damage_per_link: 1, combo_damage_cap: 4, turn_limit: 30,
      deck_min: 12, deck_max: 20, max_copies: 3, xp_on_loss: 5, replay_xp_multiplier: 0.5, starting_xp: 0,
      ai_threat_estimate: 10, max_cards_per_turn: 10, default_win_art: '', default_loss_art: '',
      exchanges_per_round: 3, rounds: 3, corner_heal_percent: 10, corner_clears_statuses: 2, corner_reshuffle: true,
      pvp_turn_seconds: 90, pvp_disconnect_seconds: 60, pvp_xp_win: 10, pvp_xp_loss: 5,
      alternate_round_start: true, knockdowns_for_tko: 3, knockdown_recover_percent: 15, knockdown_clears_statuses: true,
    };
    Object.keys(defaults).forEach(k => { if (config[k] === undefined) config[k] = defaults[k]; });

    // Statuses
    const statuses = {};
    T.Statuses.forEach(r => {
      const id = key(r.id || '');
      if (!id) return;
      if (statuses[id]) errors.push(`Statuses row ${r._row}: duplicate id "${id}".`);
      const behavior = key(r.behavior || '');
      const decay = key(r.decay || 'turn');
      if (!STATUS_BEHAVIORS.includes(behavior)) errors.push(`Statuses row ${r._row} (${id}): behavior must be one of ${STATUS_BEHAVIORS.join(', ')}.`);
      if (!STATUS_DECAYS.includes(decay)) errors.push(`Statuses row ${r._row} (${id}): decay must be one of ${STATUS_DECAYS.join(', ')}.`);
      statuses[id] = {
        id, name: r.name || id, behavior, decay, aiValue: num(r.ai_value, 1),
        color: r.color || '#cccccc', description: r.description || '', beneficial: BENEFICIAL.includes(behavior),
      };
    });

    // Cards
    const cards = {}, cardList = [];
    T.Cards.forEach(r => {
      const id = (r.id || '').trim();
      if (!id) return;
      if (cards[id]) errors.push(`Cards row ${r._row}: duplicate id "${id}".`);
      const fx = parseEffects(r.effects, statuses);
      const lb = parseEffects(r.link_bonus, statuses);
      fx.errors.forEach(e => errors.push(`Cards row ${r._row} (${id}) effects: ${e}.`));
      lb.errors.forEach(e => errors.push(`Cards row ${r._row} (${id}) link_bonus: ${e}.`));
      const tags = list(r.tags);
      const follows = list(r.follows);
      if (!tags.length) warnings.push(`Card ${id} has no tags, so nothing can link after it.`);
      if (!follows.length) warnings.push(`Card ${id} has an empty "follows", so it can never link.`);
      const c = {
        id, name: r.name || id, style: r.style || 'Neutral', tier: r.tier || 'Base',
        tags, tagKeys: tags.map(key), follows, followKeys: follows.map(key),
        cost: num(r.cost, 0), effects: fx.effects, linkBonus: lb.effects,
        text: r.text || '', xpPrice: num(r.xp_price, 0), upgradeOf: r.upgrade_of || '',
        maxCopies: num(r.max_copies, 0), art: r.art || '', flavor: r.flavor || '', order: cardList.length,
      };
      cards[id] = c; cardList.push(c);
    });

    // Styles
    const styles = {}, styleList = [];
    T.Styles.forEach(r => {
      const id = (r.id || '').trim();
      if (!id) return;
      if (styles[id]) errors.push(`Styles row ${r._row}: duplicate id "${id}".`);
      const ts = parseEffects(r.on_turn_start, statuses);
      const ol = parseEffects(r.on_link, statuses);
      ts.errors.forEach(e => errors.push(`Styles row ${r._row} (${id}) on_turn_start: ${e}.`));
      ol.errors.forEach(e => errors.push(`Styles row ${r._row} (${id}) on_link: ${e}.`));
      const deck = parseDeckList(r.base_deck);
      deck.errors.forEach(e => errors.push(`Styles row ${r._row} (${id}) base_deck: ${e}.`));
      const s = {
        id, name: r.name || id, root: r.root || id, description: r.description || '',
        hp: num(r.hp, 40), energy: num(r.energy, null), handSize: num(r.hand_size, null),
        onTurnStart: ts.effects, onLink: ol.effects, baseDeck: deck.ids,
        evolvesTo: r.evolves_to || '', evolveXp: num(r.evolve_xp, 0), evolveRequires: r.evolve_requires || '',
        color: r.color || '#c9c3ef', art: r.art || '',
      };
      styles[id] = s; styleList.push(s);
    });

    // Opponents
    const opponents = [];
    T.Opponents.forEach(r => {
      const id = (r.id || '').trim();
      if (!id) return;
      const deck = parseDeckList(r.deck);
      deck.errors.forEach(e => errors.push(`Opponents row ${r._row} (${id}) deck: ${e}.`));
      opponents.push({
        id, order: num(r.order, opponents.length + 1), name: r.name || id, title: r.title || '',
        style: r.style || '', deck: deck.ids, hpBonus: num(r.hp_bonus, 0),
        aggression: num(r.aggression, 1), caution: num(r.caution, 1), xpReward: num(r.xp_reward, 20),
        color: r.color || '', art: r.art || '', intro: r.intro || '',
        winArt: r.win_art || '', lossArt: r.loss_art || '',
        rounds: num(r.rounds, 0),
      });
    });
    opponents.sort((a, b) => a.order - b.order);

    // Cross-reference validation
    const allTags = new Set();
    cardList.forEach(c => c.tagKeys.forEach(t => allTags.add(t)));
    cardList.forEach(c => {
      if (c.style !== 'Neutral' && !styles[c.style]) errors.push(`Card ${c.id}: style "${c.style}" is not in the Styles tab (use Neutral for shared cards).`);
      if (c.upgradeOf && !cards[c.upgradeOf]) errors.push(`Card ${c.id}: upgrade_of "${c.upgradeOf}" doesn't exist.`);
      c.followKeys.forEach(f => {
        if (f !== 'start' && f !== 'any' && !allTags.has(f)) warnings.push(`Card ${c.id} follows "${f}", but no card has that tag.`);
      });
    });
    const checkDeck = (ids, where) => ids.forEach(id => { if (!cards[id]) errors.push(`${where}: card "${id}" doesn't exist.`); });
    styleList.forEach(s => {
      checkDeck(s.baseDeck, `Style ${s.id} base_deck`);
      if (s.evolvesTo && !styles[s.evolvesTo]) errors.push(`Style ${s.id}: evolves_to "${s.evolvesTo}" doesn't exist.`);
      if (!styles[s.root]) errors.push(`Style ${s.id}: root "${s.root}" doesn't exist.`);
      if (s.evolveRequires && !opponents.find(o => o.id === s.evolveRequires)) errors.push(`Style ${s.id}: evolve_requires "${s.evolveRequires}" is not an opponent id.`);
      if (s.baseDeck.length < config.deck_min) warnings.push(`Style ${s.id}: base deck has ${s.baseDeck.length} cards, below deck_min ${config.deck_min}.`);
    });
    opponents.forEach(o => {
      if (!styles[o.style]) errors.push(`Opponent ${o.id}: style "${o.style}" doesn't exist.`);
      checkDeck(o.deck, `Opponent ${o.id} deck`);
    });
    if (!styleList.length) errors.push('The Styles tab has no styles.');
    if (!cardList.length) errors.push('The Cards tab has no cards.');

    // Card text: use the sheet's text if given, otherwise generate from effects.
    const data = { config, statuses, statusList: Object.values(statuses), cards, cardList, styles, styleList, opponents, meta: meta || {} };
    cardList.forEach(c => {
      c.autoText = describeEffects(c.effects, data);
      c.linkText = describeEffects(c.linkBonus, data);
      c.displayText = c.text || c.autoText;
    });
    styleList.forEach(s => {
      s.passiveText = [
        s.onTurnStart.length ? `Turn start: ${describeEffects(s.onTurnStart, data)}` : '',
        s.onLink.length ? `On every link: ${describeEffects(s.onLink, data)}` : '',
      ].filter(Boolean).join(' ');
    });
    compileArt(T, data, warnings);
    return { data, errors, warnings };
  }

  /* A sheet (or CSV set) that doesn't have an optional tab borrows the
   * built-in copy, so the art paths shipped with the game work without
   * adding the CutIns or Fighters tab to your own sheet. A tab the sheet does
   * have always wins. */
  function fillOptionalTabs(tables, defaults) {
    const out = Object.assign({}, tables);
    OPTIONAL_TABS.forEach(t => {
      const has = out[t] != null && String(out[t]).trim() !== '' && (Array.isArray(out[t]) || hasSignature(t, parseCSV(out[t])));
      if (!has && defaults && defaults[t] != null) out[t] = defaults[t];
    });
    return out;
  }

  /* ---------- Google Sheets ---------- */
  function extractSheetId(input) {
    const s = String(input || '').trim();
    const m = s.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    return m ? m[1] : s;
  }
  function sheetCsvUrl(sheetId, tab) {
    return `https://docs.google.com/spreadsheets/d/${encodeURIComponent(sheetId)}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(tab)}`;
  }
  async function fetchSheetTables(sheetIdOrUrl, fetchFn) {
    const f = fetchFn || fetch;
    const id = extractSheetId(sheetIdOrUrl);
    const tables = {};
    await Promise.all(REQUIRED_TABS.map(async tab => {
      const res = await f(sheetCsvUrl(id, tab));
      if (!res.ok) throw new Error(`Couldn't read the "${tab}" tab (HTTP ${res.status}). Is the sheet shared as "Anyone with the link can view"?`);
      const text = await res.text();
      if (/^\s*</.test(text)) throw new Error(`The "${tab}" tab came back as a web page, not data. Check the sheet is shared publicly and the tab name is exactly "${tab}".`);
      tables[tab] = text;
    }));
    // Optional tabs: a sheet without them is fine. Google answers a missing tab
    // name with some other tab, so only keep text whose header matches.
    await Promise.all(OPTIONAL_TABS.map(async tab => {
      try {
        const res = await f(sheetCsvUrl(id, tab));
        if (!res.ok) return;
        const text = await res.text();
        if (/^\s*</.test(text) || !hasSignature(tab, parseCSV(text))) return;
        tables[tab] = text;
      } catch (e) { /* treat as absent */ }
    }));
    return tables;
  }

  return {
    TABS, REQUIRED_TABS, OPTIONAL_TABS, CUTIN_SLOTS, CUTIN_VIEWS, CUTIN_EVENTS, EFFECT_OPS, STATUS_BEHAVIORS, STATUS_DECAYS,
    parseCSV, rowsToObjects, parseEffects, parseDeckList, describeEffects, compileData, fillOptionalTabs,
    extractSheetId, sheetCsvUrl, fetchSheetTables,
  };
});

<script>/* src/engine.js */
/* Foxy Fight — rules engine.
 * Pure functions over a plain-object match state, so the same code runs the
 * GUI, the AI's look-ahead, and the headless balance simulator.
 *
 * Turn flow
 *   startTurn: block resets, start-of-turn statuses (Bleed) tick, energy refills
 *              (minus Stagger), cards are drawn (minus Dazed), statuses decay,
 *              the style's on_turn_start effects fire.
 *   playCard:  pay energy, check the chain, resolve effects, then the link bonus
 *              and the style's on_link effects if the card linked.
 *   endTurn:   discard hand, hand the turn to the other fighter.
 *
 * Rounds (Config exchanges_per_round > 0)
 *   An exchange is one turn each. After exchanges_per_round exchanges the round
 *   ends: three judges score it (10-point must), then both fighters go to the
 *   corner (heal, clear statuses, reshuffle) and the next round starts with the
 *   other fighter leading. After the last round the judges' cards decide it.
 *   Judges: #1 scores damage, #2 damage + 2 per link, #3 damage + 1 per landed hit.
 *   A fighter knocked down in a round loses it 10-8 (10-7 for two knockdowns...).
 *
 * Knockdowns (Config knockdowns_for_tko > 0)
 *   Hitting 0 HP is a knockdown: the fighter gets back up with
 *   knockdown_recover_percent of max HP and the current turn ends at once.
 *   The knockdowns_for_tko-th knockdown ends the fight (T.K.O.).
 *   With knockdowns_for_tko = 0, 0 HP is an immediate K.O.
 *
 * Chain rule
 *   The first card of a turn links if its "follows" list contains START.
 *   Any later card links if its "follows" contains ANY, or one of the previous
 *   card's tags, or the previous card has the Wild tag. A card that doesn't
 *   link starts a new chain of length 1. */
(function (root, factory) {
  const mod = factory();
  if (typeof module === 'object' && module.exports) module.exports = mod;
  else root.CB = Object.assign(root.CB || {}, mod);
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------- RNG (mulberry32, state kept in the match so clones stay deterministic) ---------- */
  function rand(state) {
    let t = (state.seed = (state.seed + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function shuffle(state, arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand(state) * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function emit(state, ev) { if (state.events) state.events.push(ev); }

  /* ---------- setup ---------- */
  function createFighter(state, data, spec, index) {
    const style = data.styles[spec.styleId];
    if (!style) throw new Error(`Unknown style "${spec.styleId}"`);
    const deckIds = (spec.deck && spec.deck.length ? spec.deck : style.baseDeck).filter(id => data.cards[id]);
    const deck = deckIds.map(id => ({ uid: ++state.uid, id }));
    shuffle(state, deck);
    const maxHp = Math.max(1, style.hp + (spec.hpBonus || 0));
    return {
      index, name: spec.name || style.name, styleId: style.id, isAI: !!spec.isAI,
      hp: maxHp, maxHp, block: 0, energy: 0,
      maxEnergy: style.energy != null ? style.energy : data.config.energy_per_turn,
      handSize: style.handSize != null ? style.handSize : data.config.hand_size,
      deck, hand: [], discard: [], statuses: {},
      taken: 0, knockdowns: 0,
      chain: { length: 0, tags: [], links: 0, played: 0 },
      stats: { played: 0, links: 0, bestChain: 0, damageDealt: 0, turns: 0, cardPlays: {}, cardLinks: {}, cardDamage: {} },
    };
  }

  function createMatch(data, specA, specB, opts) {
    opts = opts || {};
    const cfg = data.config;
    const state = {
      seed: (opts.seed != null ? opts.seed : Math.floor(Math.random() * 2 ** 31)) | 0,
      uid: 0, active: 0, first: 0, over: false, winner: null, endReason: '',
      events: opts.noEvents ? null : [], turnCount: 0, halt: false,
      // rounds
      roundsMode: cfg.exchanges_per_round > 0,
      maxRounds: Math.max(1, opts.rounds || cfg.rounds || 1),
      round: 1, exchange: 1, exchangeInRound: 1, turnInRound: 0, roundStarter: 0,
      roundStats: freshRoundStats(), scorecards: [], decision: null,
    };
    state.fighters = [createFighter(state, data, specA, 0), createFighter(state, data, specB, 1)];
    state.first = opts.firstPlayer != null ? opts.firstPlayer : (rand(state) < 0.5 ? 0 : 1);
    state.active = state.first;
    state.roundStarter = state.first;

  function cloneState(state) {
    const cf = f => ({
      ...f,
      deck: f.deck.slice(), hand: f.hand.slice(), discard: f.discard.slice(),
      statuses: { ...f.statuses }, chain: { ...f.chain, tags: f.chain.tags.slice() },
      stats: { played: 0, links: 0, bestChain: 0, damageDealt: 0, turns: 0, cardPlays: {}, cardLinks: {}, cardDamage: {} },
    });

      ...state, fighters: [cf(state.fighters[0]), cf(state.fighters[1])], events: null,
      roundStats: { dmg: state.roundStats.dmg.slice(), links: state.roundStats.links.slice(), hits: state.roundStats.hits.slice(), kd: state.roundStats.kd.slice() },

    if (amount <= 0) return;

    f.hp = Math.max(0, f.hp - amount);
    emit(state, { type: 'hp', who: f.index, amount: -amount, source });
    checkKO(state, data);
  }

  function finish(state, winner, reason) {
    state.over = true;
    state.winner = winner;
    state.endReason = reason;
    emit(state, { type: 'end', winner, reason, decision: state.decision });
  }

  function checkKO(state, data) {
    if (state.over) return;
    const cfg = data.config;
    // the active fighter's opponent is checked first, so a double knockout favours the attacker
    for (const f of [state.fighters[1 - state.active], state.fighters[state.active]]) {
      if (f.hp > 0 || state.over) continue;
      const tko = cfg.knockdowns_for_tko;
      if (!(tko > 1)) { finish(state, 1 - f.index, 'ko'); return; }
      f.knockdowns++;
      state.roundStats.kd[f.index]++;
      if (f.knockdowns >= tko) {
        emit(state, { type: 'knockdown', who: f.index, count: f.knockdowns, final: true });
        finish(state, 1 - f.index, 'tko');
        return;
      }
      f.hp = Math.max(1, Math.ceil(f.maxHp * cfg.knockdown_recover_percent / 100));
      f.block = 0;
      if (cfg.knockdown_clears_statuses) f.statuses = {};
      state.halt = true; // the count stops the current turn
      emit(state, { type: 'knockdown', who: f.index, count: f.knockdowns, hp: f.hp });
    }
  }

  function dealHit(state, data, attacker, target, amount, opts) {
    if (state.over) return 0;
    amount += stacksByBehavior(data, target, 'damage_taken_up');
    amount = Math.max(0, amount);
    let blocked = 0;
    if (!opts.pierce && target.block > 0) {
      blocked = Math.min(target.block, amount);
      target.block -= blocked;
      amount -= blocked;
    }
    target.taken += Math.min(target.hp, amount);
    state.roundStats.dmg[attacker.index] += Math.min(target.hp, amount);
    if (amount > 0) state.roundStats.hits[attacker.index]++;
    target.hp = Math.max(0, target.hp - amount);
    attacker.stats.damageDealt += amount;
    if (opts.cardId) attacker.stats.cardDamage[opts.cardId] = (attacker.stats.cardDamage[opts.cardId] || 0) + amount;
    emit(state, { type: 'hit', from: attacker.index, who: target.index, amount, blocked, pierce: !!opts.pierce });
    checkKO(state, data);
    const thorns = stacksByBehavior(data, target, 'thorns');
    if (thorns > 0 && !state.over && !state.halt) {
      attacker.taken += Math.min(attacker.hp, thorns);
      state.roundStats.dmg[target.index] += Math.min(attacker.hp, thorns);
      attacker.hp = Math.max(0, attacker.hp - thorns);
      emit(state, { type: 'hp', who: attacker.index, amount: -thorns, source: 'thorns' });
      checkKO(state, data);
    }

  }

  function addStatus(state, data, f, id, n) {
    if (!data.statuses[id] || n === 0) return;
    f.statuses[id] = Math.max(0, (f.statuses[id] || 0) + n);
    if (!f.statuses[id]) delete f.statuses[id];
    emit(state, { type: 'status', who: f.index, status: id, n });
  }

  /* ctx: { me, opp, cardId, comboBonus, firstHit, attacked } */
  function resolveEffects(state, data, effects, ctx) {
    const { me, opp } = ctx;
    for (const e of effects) {
      if (state.over || state.halt) return;
      switch (e.op) {
        case 'dmg':
        case 'pierce':
        case 'dmgchain': {
          const hits = e.op === 'dmg' ? e.hits : 1;
          const base = e.op === 'dmgchain' ? e.n * Math.max(1, me.chain.length) : e.n;
          for (let h = 0; h < hits && !state.over && !state.halt; h++) {
            let amount = base;
            if (ctx.firstHit) {

              // damage_dealt_up statuses (Focus) boost the first hit; 'consume' ones are used up
              for (const id in me.statuses) {
                const sd = data.statuses[id];

                amount += me.statuses[id];
                if (sd.decay === 'consume') { ctx.spent = ctx.spent || {}; ctx.spent[id] = me.statuses[id]; }

        case 'block': {

          me.block += amt;
          emit(state, { type: 'block', who: me.index, n: amt });
          break;

        case 'heal': {
          const before = me.hp;
          me.hp = Math.min(me.maxHp, me.hp + e.n);
          emit(state, { type: 'hp', who: me.index, amount: me.hp - before, source: 'heal' });
          break;
        }
        case 'draw': draw(state, data, me, e.n); break;
        case 'energy':
          me.energy += e.n;
          emit(state, { type: 'energy', who: me.index, n: e.n });

        case 'gain': addStatus(state, data, me, e.status, e.n); break;

  function startTurn(state, data) {

    const opp = state.fighters[1 - state.active];

    if (data.config.block_resets_each_turn) me.block = 0;

      if (s && s.behavior === 'dot') loseHp(state, data, me, me.statuses[id], id);
    }
    if (state.over) return;
    if (state.halt) { endTurn(state, data); return; } // knocked down by a Cut before acting

    let energy = me.maxEnergy - stacksByBehavior(data, me, 'energy_down');
    if (firstTurnOfMatch) energy -= data.config.first_turn_energy_penalty;
    me.energy = Math.max(0, energy);
    let drawN = me.handSize - stacksByBehavior(data, me, 'draw_down');
    if (firstTurnOfMatch) drawN -= (data.config.first_turn_draw_penalty || 0);
    drawN = Math.max(0, drawN);

    // decay
    for (const id of Object.keys(me.statuses)) {
      const s = data.statuses[id];
      if (!s) continue;
      if (s.decay === 'turn') me.statuses[id] -= 1;
      else if (s.decay === 'clear') me.statuses[id] = 0;
      if (me.statuses[id] <= 0) delete me.statuses[id];
    }

    draw(state, data, me, drawN);
    const style = data.styles[me.styleId];
    if (style.onTurnStart.length) resolveEffects(state, data, style.onTurnStart, { me, opp, comboBonus: 0, firstHit: false });
  }

  /* ---------- rounds ---------- */
  function scoreRound(state) {
    const r = state.roundStats;
    const criteria = [
      i => r.dmg[i],                    // judge 1: damage
      i => r.dmg[i] + 2 * r.links[i],   // judge 2: likes combinations
      i => r.dmg[i] + r.hits[i],        // judge 3: likes activity
    ];
    return criteria.map(c => {
      if (r.kd[0] !== r.kd[1]) {
        const down = r.kd[0] > r.kd[1] ? 0 : 1, diff = Math.abs(r.kd[0] - r.kd[1]);
        const card = [10, 10]; card[down] = Math.max(6, 9 - diff);
        return card;
      }
      const a = c(0), b = c(1);
      return a === b ? [10, 10] : (a > b ? [10, 9] : [9, 10]);
    });
  }

  function decide(state) {
    const totals = [0, 1, 2].map(j => state.scorecards.reduce((t, sc) => [t[0] + sc.judges[j][0], t[1] + sc.judges[j][1]], [0, 0]));
    let v0 = 0, v1 = 0;
    totals.forEach(t => { if (t[0] > t[1]) v0++; else if (t[1] > t[0]) v1++; });
    let winner, type;
    if (v0 === v1) {
      const [a, b] = state.fighters;
      const pa = a.hp / a.maxHp, pb = b.hp / b.maxHp;
      winner = pa === pb ? (a.taken <= b.taken ? 0 : 1) : (pa > pb ? 0 : 1);
      type = 'technical';
    } else {
      winner = v0 > v1 ? 0 : 1;
      const w = Math.max(v0, v1), l = Math.min(v0, v1);
      type = w === 3 ? 'unanimous' : (l === 1 ? 'split' : 'majority');
    }
    state.decision = { type, totals, winner };
    finish(state, winner, 'decision');
  }

  function endRound(state, data) {
    const cfg = data.config;
    const judges = scoreRound(state);
    const sc = { round: state.round, judges, dmg: state.roundStats.dmg.slice(), kd: state.roundStats.kd.slice() };
    state.scorecards.push(sc);
    emit(state, { type: 'roundEnd', round: state.round, judges, dmg: sc.dmg, kd: sc.kd, last: state.round >= state.maxRounds });
    if (state.round >= state.maxRounds) { decide(state); return; }
    // the corner
    for (const f of state.fighters) {
      const heal = Math.ceil(f.maxHp * (cfg.corner_heal_percent || 0) / 100);
      const before = f.hp;
      f.hp = Math.min(f.maxHp, f.hp + heal);
      f.block = 0;
      // TRUE clears every status; a number removes that many stacks of each
      if (cfg.corner_clears_statuses === true) f.statuses = {};
      else if (cfg.corner_clears_statuses > 0) {
        for (const id of Object.keys(f.statuses)) {
          f.statuses[id] -= cfg.corner_clears_statuses;
          if (f.statuses[id] <= 0) delete f.statuses[id];
        }
      }
      if (cfg.corner_reshuffle) {
        f.deck.push(...f.hand, ...f.discard); f.hand = []; f.discard = [];
        shuffle(state, f.deck);
      }
      emit(state, { type: 'corner', who: f.index, healed: f.hp - before });
    }
    state.round++;
    state.exchange++;
    state.exchangeInRound = 1;
    state.turnInRound = 0;
    state.roundStats = freshRoundStats();
    if (cfg.alternate_round_start) state.roundStarter = 1 - state.roundStarter;
    state.active = state.roundStarter;
    emit(state, { type: 'roundStart', round: state.round, starter: state.active });
  }

  function wouldLink(f, card) {
    if (f.chain.length === 0) return card.followKeys.includes('start');
    if (card.followKeys.includes('any')) return true;
    if (f.chain.tags.includes('wild')) return true;
    return card.followKeys.some(t => f.chain.tags.includes(t));
  }

  function canPlay(state, data, handIndex) {
    if (state.over) return false;
    const f = state.fighters[state.active];
    const inst = f.hand[handIndex];
    if (!inst) return false;
    if (data.config.max_cards_per_turn > 0 && f.chain.played >= data.config.max_cards_per_turn) return false;
    return data.cards[inst.id].cost <= f.energy;
  }

  function playCard(state, data, handIndex) {
    if (!canPlay(state, data, handIndex)) return { ok: false };
    const me = state.fighters[state.active];
    const opp = state.fighters[1 - state.active];
    const inst = me.hand.splice(handIndex, 1)[0];
    const card = data.cards[inst.id];
    me.energy -= card.cost;

    const linked = wouldLink(me, card);
    me.chain.length = linked ? me.chain.length + 1 : 1;
    me.chain.links = linked ? me.chain.links + 1 : 0;
    me.chain.tags = card.tagKeys.slice();
    me.chain.played = (me.chain.played || 0) + 1;
    me.stats.played++;
    me.stats.cardPlays[card.id] = (me.stats.cardPlays[card.id] || 0) + 1;
    if (linked) { me.stats.links++; me.stats.cardLinks[card.id] = (me.stats.cardLinks[card.id] || 0) + 1; }
    me.stats.bestChain = Math.max(me.stats.bestChain, me.chain.length);
    if (linked) state.roundStats.links[me.index]++;

    const cfg = data.config;
    const comboBonus = linked ? Math.min(cfg.combo_damage_cap, Math.floor(Math.max(0, me.chain.length - 1) * cfg.combo_damage_per_link)) : 0;
    // kd = the attacker's knockdowns before this card resolves. The screen reads
    // events only after the whole card is done, and Counterpunch can drop the
    // attacker mid-card, so the cut-in art needs the count from this moment.
    emit(state, { type: 'play', who: me.index, uid: inst.uid, cardId: card.id, linked, chain: me.chain.length, comboBonus, kd: me.knockdowns });

    const ctx = { me, opp, cardId: card.id, comboBonus, firstHit: true, attacked: false };
    resolveEffects(state, data, card.effects, ctx);
    if (linked && !state.over) {
      resolveEffects(state, data, card.linkBonus, ctx);
      const style = data.styles[me.styleId];
      if (style.onLink.length && !state.over) resolveEffects(state, data, style.onLink, { me, opp, comboBonus: 0, firstHit: false, cardId: card.id });
    }
    // Spend only the Focus that this card's first hit actually used (Focus gained by this card stays)
    if (ctx.spent) for (const id in ctx.spent) addStatus(state, data, me, id, -ctx.spent[id]);
    me.discard.push(inst);
    const knockdown = state.halt;
    if (state.halt && !state.over) endTurn(state, data); // a knockdown ends the turn
    return { ok: true, linked, chain: me.chain.length, knockdown };
  }

  function endTurn(state, data) {
    if (state.over) return;
    const cfg = data.config;
    state.halt = false;
    const me = state.fighters[state.active];
    if (cfg.discard_hand_end_of_turn) { me.discard.push(...me.hand); me.hand = []; }
    emit(state, { type: 'endTurn', who: me.index });
    state.turnInRound++;
    if (state.roundsMode && state.turnInRound >= 2 * cfg.exchanges_per_round) {
      endRound(state, data);
      if (!state.over) startTurn(state, data);
      return;
    }
    state.active = 1 - state.active;
    if (state.active === state.roundStarter) { state.exchange++; state.exchangeInRound++; }
    if (state.exchange > cfg.turn_limit * (state.roundsMode ? state.maxRounds : 1)) {
      const [a, b] = state.fighters;
      const pa = a.hp / a.maxHp, pb = b.hp / b.maxHp;
      finish(state, pa === pb ? (a.hp >= b.hp ? 0 : 1) : (pa > pb ? 0 : 1), 'time');
      return;
    }
    startTurn(state, data);
  }

  /* Preview of what a card would do right now — used for UI hints. */
  function previewCard(state, data, handIndex) {
    const f = state.fighters[state.active];
    const inst = f.hand[handIndex];
    if (!inst) return null;
    const card = data.cards[inst.id];
    const linked = wouldLink(f, card);
    const capped = data.config.max_cards_per_turn > 0 && f.chain.played >= data.config.max_cards_per_turn;
    const chainAfter = linked ? f.chain.length + 1 : 1;
    const cfg = data.config;
    const comboBonus = linked ? Math.min(cfg.combo_damage_cap, Math.floor((chainAfter - 1) * cfg.combo_damage_per_link)) : 0;
    return { linked, chainAfter, comboBonus, affordable: card.cost <= f.energy && !capped };
  }

  return {
    rand, shuffle, createMatch, cloneState, startTurn, endTurn, playCard, canPlay, wouldLink, previewCard,
    stacksByBehavior, statusStacks: st,
  };
});

<script>/* src/ai.js */
/* Foxy Fight — AI opponent.
 * Searches the orders it could play its current hand in (on a copy of the match
 * with its own draw pile reshuffled, so it can't peek at upcoming cards), scores
 * each end point, and plays the first card of the best line. It re-plans after
 * every card, so draws mid-turn are handled naturally.
 *
 * Personality comes from the Opponents tab:
 *   aggression scales the value of damage and harmful statuses on the enemy
 *   caution    scales the value of block, healing and defensive statuses */
(function (root, factory) {
  const E = (typeof module === 'object' && module.exports) ? require('./engine.js') : root.CB;
  const mod = factory(E);
  if (typeof module === 'object' && module.exports) module.exports = mod;
  else root.CB = Object.assign(root.CB || {}, mod);
})(typeof self !== 'undefined' ? self : this, function (E) {
  'use strict';

  function statusScore(data, f) {
    let good = 0, bad = 0;
    for (const id in f.statuses) {
      const s = data.statuses[id];
      if (!s) continue;
      if (s.beneficial) good += s.aiValue * f.statuses[id];
      else bad += s.aiValue * f.statuses[id];
    }
    return { good, bad };
  }

  function evaluate(data, root, node, meIdx, profile) {
    const me0 = root.fighters[meIdx], opp0 = root.fighters[1 - meIdx];
    const me = node.fighters[meIdx], opp = node.fighters[1 - meIdx];
    if (node.over) return node.winner === meIdx ? 10000 - (me.chain.played || 0) : -10000;
    const threat = data.config.ai_threat_estimate;
    const agg = profile.aggression, cau = profile.caution;
    let s = 0;
    const oppDowns = opp.knockdowns - opp0.knockdowns, myDowns = me.knockdowns - me0.knockdowns;
    s += agg * (opp.taken - opp0.taken);                        // damage dealt (survives knockdown resets)
    s -= 1.2 * (me.taken - me0.taken);                          // self-damage (Counterpunch)
    s += agg * 30 * oppDowns;                                   // knockdowns win rounds and end fights
    s -= 60 * myDowns;
    if (!myDowns) s += cau * 0.9 * Math.max(0, me.hp - me0.hp); // healing
    s += cau * (0.8 * Math.min(me.block, threat) + 0.1 * Math.max(0, me.block - threat));
    const so = statusScore(data, opp), sm = statusScore(data, me);
    const so0 = statusScore(data, opp0), sm0 = statusScore(data, me0);
    if (!oppDowns) s += agg * ((so.bad - so0.bad) - (so.good - so0.good));
    if (!myDowns) s += cau * ((sm.good - sm0.good) - (sm.bad - sm0.bad));
    // Killing blow pressure: closer to a knockdown is worth a bit more
    if (!oppDowns && opp.hp < opp0.hp) s += agg * 4 * (1 - opp.hp / opp.maxHp);
    s += 0.05 * me.energy; // tiny tie-breaker: don't waste plays that do nothing
    return s;
  }

  function chooseAction(state, data, profile, opts) {
    profile = profile || { aggression: 1, caution: 1 };
    const budget = (opts && opts.budget) || 500;
    const meIdx = state.active;
    const root = E.cloneState(state);
    // hide information: reshuffle own draw pile with a separate seed
    root.seed = (state.seed ^ 0x5bd1e995) | 0;
    E.shuffle(root, root.fighters[meIdx].deck);

    let nodes = 0;
    let best = { score: evaluate(data, root, root, meIdx, profile), first: -1 };

    function dfs(node, first) {
      if (nodes >= budget || node.over) return;
      const f = node.fighters[meIdx];
      const seen = new Set();
      // try linking cards first: they usually lead to the best lines
      const order = f.hand.map((c, i) => i).sort((a, b) => {
        const la = E.wouldLink(f, data.cards[f.hand[a].id]) ? 0 : 1;
        const lb = E.wouldLink(f, data.cards[f.hand[b].id]) ? 0 : 1;
        return la - lb;
      });
      for (const i of order) {
        const id = f.hand[i].id;
        if (seen.has(id)) continue;
        seen.add(id);
        if (data.cards[id].cost > f.energy) continue;
        if (nodes >= budget) return;
        nodes++;
        const child = E.cloneState(node);
        E.playCard(child, data, i);
        const f0 = first === -1 ? i : first;
        const sc = evaluate(data, root, child, meIdx, profile);
        if (sc > best.score + 1e-9) best = { score: sc, first: f0 };
        if (child.active === meIdx) dfs(child, f0); // a knockdown ends the turn
      }
    }
    dfs(root, -1);
    return best.first;
  }

  /* Plays a whole turn instantly (used by the simulator). */
  function playTurn(state, data, profile, opts) {
    const me = state.active;
    const turn = state.turnCount;
    let guard = 0;
    while (!state.over && state.active === me && state.turnCount === turn && guard++ < 40) {
      const i = chooseAction(state, data, profile, opts);
      if (i < 0) break;
      E.playCard(state, data, i);
    }
    // a knockdown already ended the turn inside playCard
    if (!state.over && state.active === me && state.turnCount === turn) E.endTurn(state, data);
  }

  return { chooseAction, playTurn, evaluate };
});

<script>/* src/progression.js */
/* Foxy Fight — characters, XP, shop, deck building, evolution, saves.
 * No randomness anywhere: every card is bought deliberately with XP.
 * Each character (one per root style) keeps its own XP, collection, deck and
 * ladder progress. */
(function (root, factory) {
  const mod = factory();
  if (typeof module === 'object' && module.exports) module.exports = mod;
  else root.CB = Object.assign(root.CB || {}, mod);
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const SAVE_VERSION = 1;

  function newSave() { return { version: SAVE_VERSION, characters: {}, activeRoot: null }; }

  function countList(ids) { const m = {}; ids.forEach(id => { m[id] = (m[id] || 0) + 1; }); return m; }
  function sum(m) { let n = 0; for (const k in m) n += m[k]; return n; }

  function newCharacter(data, rootId) {
    const style = data.styles[rootId];
    const owned = countList(style.baseDeck);
    return {
      root: rootId, styleId: rootId, xp: data.config.starting_xp, totalXp: data.config.starting_xp,
      owned, deck: { ...owned }, beaten: {}, wins: 0, losses: 0,
    };
  }

  function getCharacter(save, data, rootId) {
    if (!save.characters[rootId]) save.characters[rootId] = newCharacter(data, rootId);
    return sanitize(data, save.characters[rootId]);
  }

  /* If the sheet changed (cards renamed or removed), keep the save usable. */
  function sanitize(data, ch) {
    if (!data.styles[ch.styleId]) ch.styleId = ch.root;
    for (const m of [ch.owned, ch.deck]) for (const id of Object.keys(m)) if (!data.cards[id] || m[id] <= 0) delete m[id];
    for (const id of Object.keys(ch.deck)) ch.deck[id] = Math.min(ch.deck[id], ch.owned[id] || 0);
    return ch;
  }

  /* The styles a character has passed through, root first. */
  function lineage(data, ch) {
    const out = [];
    let s = data.styles[ch.root];
    const guard = new Set();
    while (s && !guard.has(s.id)) {
      guard.add(s.id); out.push(s.id);
      if (s.id === ch.styleId) break;
      s = data.styles[s.evolvesTo];
    }
    return out;
  }
  function futureStyles(data, ch) {
    const out = [];
    let s = data.styles[data.styles[ch.styleId].evolvesTo];
    const guard = new Set();
    while (s && !guard.has(s.id)) { guard.add(s.id); out.push(s.id); s = data.styles[s.evolvesTo]; }
    return out;
  }

  function deckSize(ch) { return sum(ch.deck); }
  function deckIds(ch) { const ids = []; for (const id in ch.deck) for (let k = 0; k < ch.deck[id]; k++) ids.push(id); return ids; }
  function copyLimit(data, card) { return card.maxCopies || data.config.max_copies; }

  /* Shop listing for a character. Locked cards (from a future evolution) are
   * included so players can see what they're working toward. */
  function shopFor(data, ch) {
    const usable = new Set([...lineage(data, ch), 'Neutral']);
    const future = new Set(futureStyles(data, ch));
    const items = [];
    data.cardList.forEach(card => {
      if (!(card.xpPrice > 0)) return;
      const inLine = usable.has(card.style), locked = future.has(card.style);
      if (!inLine && !locked) return;
      const owned = ch.owned[card.id] || 0;
      const item = { card, price: card.xpPrice, owned, isUpgrade: !!card.upgradeOf, locked, canBuy: false, reason: '' };
      if (locked) item.reason = `Unlocks with ${data.styles[card.style].name}`;
      else if (card.upgradeOf) {
        const baseOwned = ch.owned[card.upgradeOf] || 0;
        item.baseOwned = baseOwned;
        if (!baseOwned) item.reason = `Needs a ${data.cards[card.upgradeOf].name} to upgrade`;
        else if (ch.xp < card.xpPrice) item.reason = 'Not enough XP';
        else item.canBuy = true;
      } else {
        const limit = copyLimit(data, card);
        item.limit = limit;
        if (owned >= limit) item.reason = 'Owned the maximum';
        else if (ch.xp < card.xpPrice) item.reason = 'Not enough XP';
        else item.canBuy = true;
      }
      items.push(item);
    });
    return items;
  }

  function buy(data, ch, cardId) {
    const item = shopFor(data, ch).find(i => i.card.id === cardId);
    if (!item) return { ok: false, reason: 'Not sold to this character' };
    if (!item.canBuy) return { ok: false, reason: item.reason };
    const card = item.card;
    ch.xp -= item.price;
    if (card.upgradeOf) {
      const base = card.upgradeOf;
      ch.owned[base]--; if (!ch.owned[base]) delete ch.owned[base];
      ch.owned[card.id] = (ch.owned[card.id] || 0) + 1;
      if (ch.deck[base]) {
        ch.deck[base]--; if (!ch.deck[base]) delete ch.deck[base];
        ch.deck[card.id] = (ch.deck[card.id] || 0) + 1;
      }
      return { ok: true, upgraded: base, addedToDeck: true };
    }
    ch.owned[card.id] = (ch.owned[card.id] || 0) + 1;
    let added = false;
    if (deckSize(ch) < data.config.deck_max) { ch.deck[card.id] = (ch.deck[card.id] || 0) + 1; added = true; }
    return { ok: true, addedToDeck: added };
  }

  function setDeckCount(data, ch, cardId, n) {
    const owned = ch.owned[cardId] || 0;
    n = Math.max(0, Math.min(n, owned));
    const others = deckSize(ch) - (ch.deck[cardId] || 0);
    if (others + n > data.config.deck_max) n = Math.max(0, data.config.deck_max - others);
    if (n) ch.deck[cardId] = n; else delete ch.deck[cardId];
    return n;
  }

  function deckProblems(data, ch) {
    const n = deckSize(ch), out = [];
    if (n < data.config.deck_min) out.push(`Your deck needs at least ${data.config.deck_min} cards (it has ${n}).`);
    if (n > data.config.deck_max) out.push(`Your deck can hold at most ${data.config.deck_max} cards (it has ${n}).`);
    return out;
  }

  function evolveInfo(data, ch) {
    const cur = data.styles[ch.styleId];
    const next = data.styles[cur.evolvesTo];
    if (!next) return null;
    const req = cur.evolveRequires ? data.opponents.find(o => o.id === cur.evolveRequires) : null;
    const reqMet = !req || !!ch.beaten[req.id];
    const xpMet = ch.xp >= cur.evolveXp;
    return {
      from: cur, to: next, cost: cur.evolveXp, requires: req, reqMet, xpMet, canEvolve: reqMet && xpMet,
      reason: !reqMet ? `Beat ${req.name} first` : (!xpMet ? 'Not enough XP' : ''),
    };
  }

  function evolve(data, ch) {
    const info = evolveInfo(data, ch);
    if (!info || !info.canEvolve) return { ok: false, reason: info ? info.reason : 'This style is fully evolved' };
    ch.xp -= info.cost;
    ch.styleId = info.to.id;
    return { ok: true, style: info.to };
  }

  function ladderStatus(data, ch) {
    return data.opponents.map((o, i) => ({
      opp: o, beaten: !!ch.beaten[o.id],
      unlocked: i === 0 || !!ch.beaten[data.opponents[i - 1].id] || !!ch.beaten[o.id],
    }));
  }

  function xpFor(data, ch, opp, won) {
    if (!won) return data.config.xp_on_loss;
    return Math.round(opp.xpReward * (ch.beaten[opp.id] ? data.config.replay_xp_multiplier : 1));
  }

  function recordResult(data, ch, opp, won) {
    const gained = xpFor(data, ch, opp, won);
    const firstWin = won && !ch.beaten[opp.id];
    ch.xp += gained; ch.totalXp += gained;
    if (won) { ch.wins++; ch.beaten[opp.id] = true; } else ch.losses++;
    return { gained, firstWin };
  }

  /* Save codes: base64 of the JSON, safe for any characters. */
  function exportSave(save) {
    const json = JSON.stringify(save);
    const b64 = typeof btoa === 'function'
      ? btoa(unescape(encodeURIComponent(json)))
      : Buffer.from(json, 'utf8').toString('base64');
    return 'CB1.' + b64;
  }
  function importSave(code) {
    const s = String(code || '').trim().replace(/^CB1\./, '');
    const json = typeof atob === 'function'
      ? decodeURIComponent(escape(atob(s)))
      : Buffer.from(s, 'base64').toString('utf8');
    const save = JSON.parse(json);
    if (!save || typeof save !== 'object' || !save.characters) throw new Error('That code is not a Foxy Fight save.');
    return save;
  }

  return {
    newSave, newCharacter, getCharacter, lineage, futureStyles, deckSize, deckIds, shopFor, buy,
    setDeckCount, deckProblems, evolveInfo, evolve, ladderStatus, xpFor, recordResult, exportSave, importSave,
  };
});

</script>
<script>/* src/cutins.js */
/* Foxy Fight — cut-in art: which picture to show for a card, a knockdown or a win.
 *
 * Face rule: your fighter is always shown in profile, the opponent in POV.
 *   A card shows the attacker's face; a knockdown shows the fighter going down;
 *   the result screen shows the winner.
 *
 * Every picture is looked up in the CutIns tab by (fighter, move, view, slot):

<script>/* src/art.js */
/* Foxy Fight — generated placeholder art.
 * Every card and fighter gets a deterministic art-deco illustration built from its
 * id, style color and tag, so the game looks finished before real art exists.

 * top and this placeholder only appears if the image fails to load. */
(function (root) {
  'use strict';
  const CB = root.CB = root.CB || {};

    let h = 2166136261;

  function glyph(tag, r, W, H) {
    const cx = W * 0.5, cy = H * 0.5;
    const ink = CREAM;
    switch (tag) {
      case 'opener': { // a blown kiss: concentric rings
        let s = '';
        for (let k = 3; k >= 1; k--) s += `<circle cx="${cx}" cy="${cy}" r="${k * 12}" fill="none" stroke="${ink}" stroke-width="${k === 1 ? 3.5 : 1.6}" opacity="${0.35 + 0.2 * (3 - k)}"/>`;
        return s + `<circle cx="${cx}" cy="${cy}" r="4" fill="${GOLD}"/>`;
      }
      case 'light': { // quick strikes: three speed bars
        let s = '';
        for (let k = 0; k < 3; k++) s += `<rect x="${cx - 34 + k * 14}" y="${cy - 14 + k * 11}" width="${46 - k * 8}" height="5" rx="2.5" fill="${ink}" opacity="${0.55 + k * 0.2}"/>`;

      }

        return `<rect x="${cx - 24}" y="${cy - 24}" width="48" height="48" rx="6" fill="none" stroke="${GOLD}" stroke-width="2" transform="rotate(45 ${cx} ${cy})"/>

          pts.push(`${(cx + Math.cos(a) * rr).toFixed(1)},${(cy + Math.sin(a) * rr).toFixed(1)}`);
        }

      }

        return `<path d="M${cx} ${cy - 30} L${cx + 24} ${cy - 20} L${cx + 20} ${cy + 10} L${cx} ${cy + 28} L${cx - 20} ${cy + 10} L${cx - 24} ${cy - 20} Z" fill="none" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>
          <path d="M${cx} ${cy - 20} L${cx + 14} ${cy - 14} L${cx + 11} ${cy + 6} L${cx} ${cy + 17} L${cx - 11} ${cy + 6} L${cx - 14} ${cy - 14} Z" fill="${GOLD}" opacity=".85"/>`;
      }
      case 'wild': { // a fan of feathers
        let s = '';
        for (let k = 0; k < 5; k++) {

    let s = '';

      s += `<path d="M${cx} ${cy} L${(cx + Math.cos(a) * len).toFixed(1)} ${(cy + Math.sin(a) * len).toFixed(1)} L${(cx + Math.cos(a2) * len).toFixed(1)} ${(cy + Math.sin(a2) * len).toFixed(1)} Z" fill="${color}" opacity="${op}"/>`;
    }

  }

  /* Card illustration: 160 x 100, art deco poster style */
  CB.cardArtSVG = function (card, styleColor) {
    const W = 160, H = 100;
    const r = rng(hash(card.id));
    const tag = card.tagKeys[0] || '';
    const c1 = styleColor || '#8e2437';
    const c2 = tagVar(tag);
    const gid = 'g' + hash(card.id + 'x').toString(36);
    const sx = W * (0.3 + r() * 0.4);
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1012"/><stop offset=".55" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
      <rect width="${W}" height="${H}" fill="url(#${gid})"/>
      ${rays(sx, H + 6, 14, 150, GOLD, 0.13, Math.PI / 30)}
      <path d="M${W / 2 - 46} ${H} V44 a46 46 0 0 1 92 0 V${H}" fill="none" stroke="${GOLD}" stroke-width="1.2" opacity=".55"/>
